[workspace]
resolver = "2"
members = [
  "crates/engram-core",
  "crates/engram-store",
  "crates/engram-llm",
  "crates/engram-runtime",
  "crates/engram-server",
  "crates/engram-cli",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "validate-request"] }
uuid = { version = "1", features = ["v4", "serde"] }
lazy_static = "1"
