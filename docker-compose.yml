services:
  engram:
    image: engram-agent:latest
    env_file:
      - .env
    environment:
      ENGRAM_SERVER_ADDR: 0.0.0.0:3001
      ENGRAM_DATA_DIR: /data
      ENGRAM_NEO4J_URI: bolt://neo4j:7687
      ENGRAM_NEO4J_USER: neo4j
      ENGRAM_NEO4J_PASSWORD: engram-memory
      ENGRAM_NEO4J_DATABASE: neo4j
      ENGRAM_MCP_HTTP_ENABLED: "true"
      ENGRAM_MCP_STDIO_ENABLED: "true"
      LLM_ENDPOINT: ${LLM_ENDPOINT}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_CHAT_PATH: ${LLM_CHAT_PATH}
      LLM_EMBEDDINGS_PATH: ${LLM_EMBEDDINGS_PATH}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_RERANK_ENDPOINT: ${LLM_RERANK_ENDPOINT}
      ENGRAM_DASHSCOPE_API_KEY: ${ENGRAM_DASHSCOPE_API_KEY}
      ENGRAM_REQUIRE_LLM: ${ENGRAM_REQUIRE_LLM}
      ENGRAM_LOKI_URL: http://loki:3100
      RUST_LOG: info
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "3001:3001"
    networks:
      - engram-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/engram-memory
      NEO4J_server_http_enabled: "true"
      NEO4J_server_bolt_enabled: "true"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - engram-neo4j-data:/data
      - engram-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped
    networks:
      - engram-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - engram-net

  promtail:
    image: grafana/promtail:2.9.0
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
    restart: unless-stopped
    networks:
      - engram-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-engram-dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_SERVER_DOMAIN: "0.0.0.0"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SRS_SAME_SITE_POLICY: "disabled"
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - engram-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  engram-net:
    driver: bridge

volumes:
  engram-data:
  engram-neo4j-data:
  engram-neo4j-logs:
  loki-data:
  grafana-data: