name: Deploy

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]
    types: [closed]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    outputs:
      deploy_target: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" && ("${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/release/"*) ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" == "closed" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi
          echo "Branch: ${{ github.ref }}"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [validate-environment]
    if: needs.validate-environment.outputs.deploy_target == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUST_LOG=info

      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: [build-and-push, validate-environment]
    if: needs.validate-environment.outputs.deploy_target == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          MISSING=""
          [[ -z "${{ secrets.DEPLOY_HOST }}" ]] && MISSING="${MISSING} DEPLOY_HOST"
          [[ -z "${{ secrets.DEPLOY_USER }}" ]] && MISSING="${MISSING} DEPLOY_USER"
          [[ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]] && MISSING="${MISSING} DEPLOY_SSH_KEY"
          if [[ -n "$MISSING" ]]; then
            echo "ERROR: Missing required secrets:${MISSING}"
            echo "Please configure these in GitHub repository settings > Secrets and variables > Actions"
            exit 1
          fi
          
          echo "DEBUG: DEPLOY_HOST chars = ${#DEPLOY_HOST}"
          echo "DEBUG: DEPLOY_USER chars = ${#DEPLOY_USER}"
          echo "DEBUG: DEPLOY_SSH_KEY chars = ${#DEPLOY_SSH_KEY}"

      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Add SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Create deployment script
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Lowercase the repository name for Docker compatibility
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
          IMAGE="$REGISTRY/$IMAGE_NAME_LOWER:$SHA"
          
          # Write deployment script file by file
          {
            echo "#!/bin/bash"
            echo "set -e"
            echo ""
            echo "IMAGE=\"$IMAGE\""
            echo "DEPLOY_DIR=\"/home/\$SSH_USER/engram\""
            echo "SSH_HOST=\"\$SSH_HOST\""
            echo "SSH_USER=\"\$SSH_USER\""
            echo ''
            echo 'echo "=== Deployment Configuration ==="'
            echo 'echo "Image: $IMAGE"'
            echo 'echo "Deploy directory: $DEPLOY_DIR"'
            echo 'echo "SSH Host: $SSH_HOST"'
            echo ''
            echo 'mkdir -p "$DEPLOY_DIR"'
            echo ''
            echo '# Create fresh .env file if it does not exist'
            echo 'ENV_FILE="$DEPLOY_DIR/.env"'
            echo 'if [[ ! -f "$ENV_FILE" ]]; then'
            echo '  echo "Creating fresh .env file..."'
            echo '  cat > "$ENV_FILE" << '"'"'ENV_TEMPLATE'"'"''
            echo 'LLM_ENDPOINT=$LLM_ENDPOINT'
            echo 'LLM_API_KEY=$LLM_API_KEY'
            echo 'LLM_MODEL=$LLM_MODEL'
            echo 'LLM_CHAT_PATH=$LLM_CHAT_PATH'
            echo 'LLM_EMBEDDINGS_PATH=$LLM_EMBEDDINGS_PATH'
            echo 'LLM_EMBEDDING_MODEL=$LLM_EMBEDDING_MODEL'
            echo 'LLM_RERANK_ENDPOINT=$LLM_RERANK_ENDPOINT'
            echo 'ENGRAM_DASHSCOPE_API_KEY=$ENGRAM_DASHSCOPE_API_KEY'
            echo 'ENGRAM_REQUIRE_LLM=$ENGRAM_REQUIRE_LLM'
            echo 'GRAFANA_PASSWORD=$GRAFANA_PASSWORD'
            echo 'ENV_TEMPLATE'
            echo 'else'
            echo '  echo "Updating existing .env file..."'
            echo '  # Backup existing .env'
            echo '  cp "$ENV_FILE" "$ENV_FILE.bak"'
            echo '  # Update LLM vars only'
            echo '  grep -v "^LLM_" "$ENV_FILE" | grep -v "^GRAFANA_" > "$ENV_FILE.new"'
            echo '  echo "LLM_ENDPOINT=$LLM_ENDPOINT" >> "$ENV_FILE.new"'
            echo '  echo "LLM_API_KEY=$LLM_API_KEY" >> "$ENV_FILE.new"'
            echo '  echo "LLM_MODEL=$LLM_MODEL" >> "$ENV_FILE.new"'
            echo '  echo "LLM_CHAT_PATH=$LLM_CHAT_PATH" >> "$ENV_FILE.new"'
            echo '  echo "LLM_EMBEDDINGS_PATH=$LLM_EMBEDDINGS_PATH" >> "$ENV_FILE.new"'
            echo '  echo "LLM_EMBEDDING_MODEL=$LLM_EMBEDDING_MODEL" >> "$ENV_FILE.new"'
            echo '  echo "LLM_RERANK_ENDPOINT=$LLM_RERANK_ENDPOINT" >> "$ENV_FILE.new"'
            echo '  echo "ENGRAM_DASHSCOPE_API_KEY=$ENGRAM_DASHSCOPE_API_KEY" >> "$ENV_FILE.new"'
            echo '  echo "ENGRAM_REQUIRE_LLM=$ENGRAM_REQUIRE_LLM" >> "$ENV_FILE.new"'
            echo '  echo "GRAFANA_PASSWORD=$GRAFANA_PASSWORD" >> "$ENV_FILE.new"'
            echo '  mv "$ENV_FILE.new" "$ENV_FILE"'
            echo 'fi'
            echo ''
            echo 'echo "Stopping existing containers..."'
            echo "ssh \$SSH_USER@\$SSH_HOST \"docker stop \$(docker ps -aq) 2>/dev/null || true\""
            echo "ssh \$SSH_USER@\$SSH_HOST \"docker rm \$(docker ps -aq) 2>/dev/null || true\""
            echo "ssh \$SSH_USER@\$SSH_HOST \"cd \$DEPLOY_DIR \\&\\& docker compose down --remove-orphans 2>/dev/null || true\""
            echo "ssh \$SSH_USER@\$SSH_HOST \"fuser -k 7474/tcp 7687/tcp 2>/dev/null || lsof -t -i :7474 -i :7687 | xargs -r kill -9 2>/dev/null || true\""
            echo "ssh \$SSH_USER@\$SSH_HOST \"sleep 5\""
            echo ''
            echo 'echo "Backing up data..."'
            echo 'TIMESTAMP=$(date +%Y%m%d_%H%M%S)'
            echo 'ssh $SSH_USER@$SSH_HOST "cp -r $DEPLOY_DIR/data /tmp/engram_data_backup_$TIMESTAMP 2>/dev/null || true"'
            echo ''
            echo 'echo "Transferring files..."'
            echo 'tar --exclude=.git --exclude=.agents --exclude=target --exclude=web/node_modules --exclude=web/dist -czf - . | ssh $SSH_USER@$SSH_HOST "cd $DEPLOY_DIR && tar -xzf -"'
            echo ''
            echo 'echo "Pulling and tagging Docker image..."'
            echo 'ssh $SSH_USER@$SSH_HOST "docker pull $IMAGE && docker tag $IMAGE engram-agent:latest"'
            echo ''
            echo 'echo "Starting containers..."'
            echo 'ssh $SSH_USER@$SSH_HOST "cd $DEPLOY_DIR && docker compose up -d --remove-orphans --force-recreate"'
            echo ''
            echo 'echo "Waiting 60 seconds for services to start..."'
            echo 'sleep 60'
            echo ''
            echo 'echo "Verifying services..."'
            echo 'ssh $SSH_USER@$SSH_HOST "curl -sf http://localhost:7474 || echo Neo4j not ready yet"'
            echo 'ssh $SSH_USER@$SSH_HOST "curl -f http://localhost:3001/health || echo Engram not ready yet"'
            echo 'ssh $SSH_USER@$SSH_HOST "curl -f http://localhost:3000 || echo Grafana not ready yet"'
            echo ''
            echo 'ssh $SSH_USER@$SSH_HOST "docker image prune -f 2>/dev/null || true"'
            echo 'echo "=== Deployment complete ==="'
          } > deploy.sh
          chmod +x deploy.sh
          cat deploy.sh | head -30

      - name: Deploy to server
        run: |
          echo "Creating deployment directory: /home/$USER/engram..."
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p /home/${{ secrets.DEPLOY_USER }}/engram && chmod 755 /home/${{ secrets.DEPLOY_USER }}/engram"
          
          echo "Logging into GitHub Container Registry..."
          echo "${{ github.token }}" | ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          
          export LLM_ENDPOINT='${{ secrets.LLM_ENDPOINT }}'
          export LLM_API_KEY='${{ secrets.LLM_API_KEY }}'
          export LLM_MODEL='${{ secrets.LLM_MODEL }}'
          export LLM_CHAT_PATH='${{ secrets.LLM_CHAT_PATH }}'
          export LLM_EMBEDDINGS_PATH='${{ secrets.LLM_EMBEDDINGS_PATH }}'
          export LLM_EMBEDDING_MODEL='${{ secrets.LLM_EMBEDDING_MODEL }}'
          export LLM_RERANK_ENDPOINT='${{ secrets.LLM_RERANK_ENDPOINT }}'
          export ENGRAM_DASHSCOPE_API_KEY='${{ secrets.ENGRAM_DASHSCOPE_API_KEY }}'
          export ENGRAM_REQUIRE_LLM='${{ secrets.ENGRAM_REQUIRE_LLM }}'
          export GRAFANA_PASSWORD='${{ secrets.GRAFANA_PASSWORD }}'
          
          ./deploy.sh

  notify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-to-server]
    if: always() && needs.deploy-to-server.result != 'skipped'
    steps:
      - name: Create notification summary
        run: |
          echo "## Deployment Notification" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.deploy-to-server.result }}" == "success" ]]; then
            echo "✅ Deployment **succeeded**" >> $GITHUB_STEP_SUMMARY
            echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "- Deployed by: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Deployment **failed**" >> $GITHUB_STEP_SUMMARY
            echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "- Please check deployment logs" >> $GITHUB_STEP_SUMMARY
          fi
