services:
  engram:
    build:
      context: .
      dockerfile: Dockerfile
    image: engram-agent:latest
    env_file:
      - .env
    environment:
      ENGRAM_SERVER_ADDR: 0.0.0.0:3001
      ENGRAM_DATA_DIR: /data
      ENGRAM_NEO4J_URI: http://neo4j:7474
      ENGRAM_NEO4J_USER: neo4j
      ENGRAM_NEO4J_PASSWORD: engram-memory
      ENGRAM_NEO4J_DATABASE: neo4j
      ENGRAM_MCP_HTTP_ENABLED: "true"
      ENGRAM_MCP_STDIO_ENABLED: "true"
    ports:
      - "3001:3001"
    volumes:
      - engram-data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/engram-memory
      NEO4J_server_http_enabled: "true"
      NEO4J_server_bolt_enabled: "true"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  engram-data:
  neo4j-data:
  neo4j-logs:
