server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          service: engram
        __path__: /var/lib/docker/containers/**/ *.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
      - regex:
          expression: '.*\s(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)\s'
          source: log
      - labels:
          level:
          stream:
      - output:
          source: log

  - job_name: systemd
    static_configs:
      - targets:
          - localhost
        labels:
          job: systemd
          __path__: /var/log/journal/**/*.journal