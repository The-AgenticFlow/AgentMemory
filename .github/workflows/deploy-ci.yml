name: Deploy

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]
    types: [closed]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    outputs:
      deploy_target: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" && ("${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/release/"*) ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" == "closed" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi
          echo "Branch: ${{ github.ref }}"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [validate-environment]
    if: needs.validate-environment.outputs.deploy_target == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUST_LOG=info

      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: [build-and-push, validate-environment]
    if: needs.validate-environment.outputs.deploy_target == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          MISSING=""
          [[ -z "${{ secrets.DEPLOY_HOST }}" ]] && MISSING="${MISSING} DEPLOY_HOST"
          [[ -z "${{ secrets.DEPLOY_USER }}" ]] && MISSING="${MISSING} DEPLOY_USER"
          [[ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]] && MISSING="${MISSING} DEPLOY_SSH_KEY"
          if [[ -n "$MISSING" ]]; then
            echo "ERROR: Missing required secrets:${MISSING}"
            echo "Please configure these in GitHub repository settings > Secrets and variables > Actions"
            exit 1
          fi
          
          echo "DEBUG: DEPLOY_HOST chars = ${#DEPLOY_HOST}"
          echo "DEBUG: DEPLOY_USER chars = ${#DEPLOY_USER}"
          echo "DEBUG: DEPLOY_SSH_KEY chars = ${#DEPLOY_SSH_KEY}"

      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Add SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy to server
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_CHAT_PATH: ${{ secrets.LLM_CHAT_PATH }}
          LLM_EMBEDDINGS_PATH: ${{ secrets.LLM_EMBEDDINGS_PATH }}
          LLM_EMBEDDING_MODEL: ${{ secrets.LLM_EMBEDDING_MODEL }}
          LLM_RERANK_ENDPOINT: ${{ secrets.LLM_RERANK_ENDPOINT }}
          ENGRAM_DASHSCOPE_API_KEY: ${{ secrets.ENGRAM_DASHSCOPE_API_KEY }}
          ENGRAM_REQUIRE_LLM: ${{ secrets.ENGRAM_REQUIRE_LLM }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: |
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
          IMAGE="$REGISTRY/$IMAGE_NAME_LOWER:$SHA"

          echo "Creating deployment directory..."
          ssh "$SSH_USER@$SSH_HOST" "mkdir -p /home/$SSH_USER/engram && chmod 755 /home/$SSH_USER/engram"

          echo "Logging into GitHub Container Registry..."
          echo "${{ github.token }}" | ssh "$SSH_USER@$SSH_HOST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

          # Transfer project files (compose, configs, etc.) to the server
          echo "Transferring files..."
          tar --exclude=.git --exclude=.agents --exclude=target --exclude=web/node_modules --exclude=web/dist -czf - . | ssh "$SSH_USER@$SSH_HOST" "mkdir -p /home/$SSH_USER/engram && cd /home/$SSH_USER/engram && tar -xzf -"

          # Upload .env file with all LLM settings
          {
            echo "LLM_ENDPOINT=$LLM_ENDPOINT"
            echo "LLM_API_KEY=$LLM_API_KEY"
            echo "LLM_MODEL=$LLM_MODEL"
            echo "LLM_CHAT_PATH=$LLM_CHAT_PATH"
            echo "LLM_EMBEDDINGS_PATH=$LLM_EMBEDDINGS_PATH"
            echo "LLM_EMBEDDING_MODEL=$LLM_EMBEDDING_MODEL"
            echo "LLM_RERANK_ENDPOINT=$LLM_RERANK_ENDPOINT"
            echo "ENGRAM_DASHSCOPE_API_KEY=$ENGRAM_DASHSCOPE_API_KEY"
            echo "ENGRAM_REQUIRE_LLM=$ENGRAM_REQUIRE_LLM"
            echo "GRAFANA_PASSWORD=$GRAFANA_PASSWORD"
          } > .env
          scp .env "$SSH_USER@$SSH_HOST:/home/$SSH_USER/engram/.env"

          # Run deployment
          ssh "$SSH_USER@$SSH_HOST" "cd /home/$SSH_USER/engram && bash deploy.sh '$SSH_USER' '$SSH_HOST' '$IMAGE'"

  notify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-to-server]
    if: always() && needs.deploy-to-server.result != 'skipped'
    steps:
      - name: Create notification summary
        run: |
          echo "## Deployment Notification" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.deploy-to-server.result }}" == "success" ]]; then
            echo "✅ Deployment **succeeded**" >> $GITHUB_STEP_SUMMARY
            echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "- Deployed by: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Deployment **failed**" >> $GITHUB_STEP_SUMMARY
            echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "- Please check deployment logs" >> $GITHUB_STEP_SUMMARY
          fi
