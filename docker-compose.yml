services:
  engram:
    build:
      context: .
      dockerfile: Dockerfile
    image: engram-agent:latest
    env_file:
      - .env
    environment:
      ENGRAM_SERVER_ADDR: 0.0.0.0:3001
      ENGRAM_DATA_DIR: /data
    ports:
      - "3001:3001"
    volumes:
      - engram-data:/data
    restart: unless-stopped

volumes:
  engram-data:
